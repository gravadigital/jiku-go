name: CI

# Runs on every pull request and on the two long-lived branches. It never publishes anything:
# releases are cut from tags, by release.yml.
on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege. The default token is broader than anything here needs, and this workflow only
# ever reads the repository.
permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref. Pull requests get cancelled; main
  # and dev do not, so their history of runs stays complete.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: fmt, vet and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          # `stable` rather than go.mod's `go 1.25.0`, which pins no patch release. govulncheck
          # reports standard-library vulnerabilities against the toolchain that built the code,
          # so building on an outdated patch turns a fixed CVE into a failing check.
          go-version: stable
          cache: true

      # The same target a developer runs locally: gofmt, go vet, go test. Keeping CI and the
      # Makefile identical means a green local run means a green CI run.
      #
      # Nothing has to be provisioned for this. The tests reach no network and need no NATS: the
      # contract-decoding tests run against a real meta.describe reply saved in testdata/,
      # and the inbox-hash test pins values observed from a running auth-callout.
      - name: make ci (fmt, vet, race tests)
        run: make ci

      # The binary is built here too, because `go test ./...` does not compile package main's
      # link step and a broken CLI should not wait for a tag to be discovered.
      - name: make build
        run: make build

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: stable
          cache: true

      # govulncheck reports only vulnerabilities on code paths this module actually reaches, so
      # it is quiet enough to keep as a required check rather than as advisory noise.
      #
      # It is a separate job on purpose: a vulnerability disclosed in a dependency should not
      # make it look like the tests broke.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
